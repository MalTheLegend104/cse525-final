<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>UIverse Thermostat | Smart Climate & Light Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 30%, #0b1a22, #030c12);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
    }

    /* animated gradient overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 30%, rgba(66, 153, 225, 0.08), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .thermostat-container {
      width: 100%;
      max-width: 580px;
      position: relative;
      z-index: 2;
    }

    .glass-card {
      background: rgba(18, 28, 35, 0.68);
      backdrop-filter: blur(16px);
      border-radius: 64px;
      padding: 32px 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 30px 45px -20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s;
    }

    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 35px 50px -22px black;
    }

    /* temperature dial area */
    .temp-dial {
      text-align: center;
      margin-bottom: 28px;
      position: relative;
    }

    .current-temp {
      font-size: 6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #cbd5e6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -2px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      line-height: 1.1;
    }

    .current-temp small {
      font-size: 2rem;
      font-weight: 500;
      background: none;
      -webkit-background-clip: unset;
      background-clip: unset;
      color: #9aaebf;
    }

    .diff-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      padding: 6px 18px;
      border-radius: 80px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 10px;
      border: 0.5px solid rgba(255,255,255,0.15);
    }

    .diff-badge.positive { color: #ffb347; }
    .diff-badge.negative { color: #6bc5ff; }
    .diff-badge.neutral { color: #b9c8e0; }

    /* setpoint control panel */
    .setpoint-panel {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 56px;
      padding: 20px 24px;
      margin: 20px 0 28px 0;
      transition: all 0.2s;
    }

    .target-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 12px;
      gap: 10px;
    }

    .target-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      color: #8da3b5;
    }

    .target-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: white;
      line-height: 1;
    }

    .button-group {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin: 16px 0 12px 0;
    }

    .neumo-btn {
      background: rgba(25, 35, 45, 0.8);
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 40px;
      font-size: 1.8rem;
      font-weight: 600;
      color: #eef4ff;
      cursor: pointer;
      transition: 0.15s linear;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.3);
    }

    .neumo-btn:active {
      transform: scale(0.96);
      background: #1f2e3a;
    }

    .temp-input-modern {
      background: #111c24;
      border: 1px solid #2e4353;
      padding: 12px 16px;
      border-radius: 48px;
      font-size: 1rem;
      width: 110px;
      text-align: center;
      color: white;
      font-weight: 500;
      font-family: monospace;
    }

    .apply-btn {
      background: linear-gradient(105deg, #2c5f8a, #1d3f5c);
      border: none;
      padding: 10px 24px;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .apply-btn:active {
      transform: scale(0.97);
    }

    /* range slider */
    .slider-container {
      margin-top: 12px;
    }

    input[type='range'] {
      width: 100%;
      height: 5px;
      -webkit-appearance: none;
      background: #2a3b48;
      border-radius: 10px;
      outline: none;
    }

    input[type='range']:focus {
      outline: none;
    }

    input[type='range']::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #79c2ff;
      cursor: pointer;
      box-shadow: 0 0 8px #3b82f6;
      border: 1px solid white;
    }

    /* status cards grid */
    .stats-uiverse {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 28px 0 15px;
    }

    .stat-block {
      background: rgba(12, 20, 26, 0.65);
      backdrop-filter: blur(4px);
      border-radius: 38px;
      padding: 14px 6px;
      text-align: center;
      transition: 0.2s;
      border: 0.5px solid rgba(255,255,255,0.06);
    }

    .stat-icon {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7e95aa;
    }

    .stat-value {
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    /* Light active styling (replaces heating colors) */
    .light-active {
      color: #ffdd77;
      text-shadow: 0 0 8px #ffb347;
    }

    .light-idle {
      color: #7f8c8d;
    }

    .footer-note {
      text-align: center;
      font-size: 0.7rem;
      color: #3d566b;
      margin-top: 24px;
      letter-spacing: 0.3px;
    }

    @media (max-width: 480px) {
      .glass-card { padding: 24px 18px; }
      .current-temp { font-size: 4.5rem; }
      .target-value { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
<div id="app" class="thermostat-container">
  <div class="glass-card">
    <!-- Temperature display -->
    <div class="temp-dial">
      <div class="current-temp">{{ currentTemp.toFixed(1) }}<small>°F</small></div>
      <div :class="diffClass" class="diff-badge">
        <i :class="difference > 0 ? 'fas fa-arrow-up' : 'fas fa-arrow-down'"></i>
        {{ Math.abs(difference).toFixed(1) }}°F from target
      </div>
    </div>

    <!-- Setpoint controls -->
    <div class="setpoint-panel">
      <div class="target-header">
        <span class="target-label"><i class="fas fa-bullseye"></i> TARGET TEMPERATURE</span>
        <span class="target-value">{{ setpoint.toFixed(1) }}°F</span>
      </div>
      <div class="button-group">
        <button class="neumo-btn" @click="adjustSetpoint(-0.5)"><i class="fas fa-minus"></i></button>
        <input type="number" step="0.5" v-model.number="newSetpoint" class="temp-input-modern" placeholder="Set °F">
        <button class="neumo-btn" @click="adjustSetpoint(0.5)"><i class="fas fa-plus"></i></button>
        <button class="apply-btn" @click="updateSetpoint"><i class="fas fa-check-circle"></i> Apply</button>
      </div>
      <div class="slider-container">
        <input type="range" min="50" max="95" step="0.5" v-model="sliderSetpoint" @change="syncFromSlider">
      </div>
    </div>

    <!-- Status grid: Light replaces Heating (icon & label) -->
    <div class="stats-uiverse">
      <!-- LIGHT CONTROL CARD (formerly Heating) -->
      <div class="stat-block">
        <div class="stat-icon"><i class="fas fa-lightbulb"></i></div>
        <div class="stat-label">LIGHT</div>
        <div class="stat-value" :class="lightStatus ? 'light-active' : 'light-idle'">
          {{ lightStatus ? 'ON 💡' : 'OFF ⚫' }}
        </div>
      </div>
      <!-- Motion sensor remains -->
      <div class="stat-block">
        <div class="stat-icon"><i class="fas fa-person-walking"></i></div>
        <div class="stat-label">Motion</div>
        <div class="stat-value" :style="motionDetected ? {color:'#FFD966'} : {}">
          {{ motionDetected ? 'Occupied' : 'Vacant' }}
        </div>
      </div>
      <!-- Door contact remains -->
      <div class="stat-block">
        <div class="stat-icon"><i class="fas fa-door-open"></i></div>
        <div class="stat-label">Contact</div>
        <div class="stat-value" :style="!doorClosed ? {color:'#ff8a7a'} : {}">
          {{ doorClosed ? 'Closed' : 'Open' }}
        </div>
      </div>
   
<script>
  const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

  createApp({
    setup() {
      // --- Core state ---
      const currentTemp = ref(68.0);        // current room temperature (°F)
      const setpoint = ref(71.6);           // target temperature (°F)
      const motionDetected = ref(false);    // occupancy simulation
      const doorClosed = ref(true);         // door contact sensor
      const newSetpoint = ref('');
      const sliderSetpoint = ref(71.6);

      let pollInterval = null;

      const tempFuncUuid = ref(null);
      const controlFuncUuid = ref(null);
      const lightFuncUuid = ref(null);
      const lightStatus = ref(false)

      const difference = computed(() => currentTemp.value - setpoint.value);
      const diffClass = computed(() => {
        const d = difference.value;
        if (d > 0.2) return 'diff-badge positive';
        if (d < -0.2) return 'diff-badge negative';
        return 'diff-badge neutral';
      });

      // Get the UUIDs of all the nodes
      async function discoverFunctions() {
         const [tempRes, controlRes, lightRes] = await Promise.all([
              fetch("/internal/get_device?function=temperature"),
              fetch("/internal/get_device?function=control"),
              fetch("/internal/get_device?function=light")
          ]);
          const motionRes = await fetch("/internal/get_device?function=motion");
          const doorRes = await fetch("/internal/get_device?function=door");
          const motionData = await motionRes.json();
          const doorData = await doorRes.json();
          motionFuncUuid.value = motionData.func_uuid;
          doorFuncUuid.value = doorData.func_uuid;
        
          const lightData = await lightRes.json();
          lightFuncUuid.value = lightData.func_uuid;

          const tempData = await tempRes.json();
          const controlData = await controlRes.json();
          tempFuncUuid.value = tempData.func_uuid;
          controlFuncUuid.value = controlData.func_uuid;
      }

      // --- Getters ---
      async function fetchLightState() {
          if (!lightFuncUuid.value) return;
          const res = await fetch(`/internal/get_state?func_uuid=${lightFuncUuid.value}`);
          if (!res.ok) return;
          const data = await res.json();
          if (data.state.on !== undefined) lightStatus.value = data.state.on;
      }

      async function fetchSensorState() {
          if (!tempFuncUuid.value) return;
          const res = await fetch(`/internal/get_state?func_uuid=${tempFuncUuid.value}`);
          if (!res.ok) return;
          const data = await res.json();
          if (data.state.temperature !== undefined) currentTemp.value = data.state.temperature;
          if (data.state.motion !== undefined) motionDetected.value = data.state.motion;
          if (data.state.door_closed !== undefined) doorClosed.value = data.state.door_closed;
      }

      async function fetchDesiredState() {
          if (!controlFuncUuid.value) return;
          const res = await fetch(`/internal/get_state?func_uuid=${controlFuncUuid.value}`);
          if (!res.ok) return;
          const data = await res.json();
          if (data.state.setpoint !== undefined) {
              setpoint.value = data.state.setpoint;
              sliderSetpoint.value = data.state.setpoint;
          }
      }

      // --- Setpoint management ---
      async function pushSetpoint() {
          if (!controlFuncUuid.value) return;
          await fetch("/internal/set_state", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({
                  func_uuid: controlFuncUuid.value,
                  state: { setpoint: setpoint.value }
              })
          });
      }

       function updateSetpoint() {
        let val = parseFloat(newSetpoint.value);
        if (isNaN(val)) return;
        val = Math.min(95, Math.max(50, val));
        setpoint.value = val;
        sliderSetpoint.value = val;
        newSetpoint.value = '';
        pushSetpoint();
      }

      function adjustSetpoint(delta) {
          let newVal = Math.min(95, Math.max(50, setpoint.value + delta));
          setpoint.value = newVal;
          sliderSetpoint.value = newVal;
          pushSetpoint();
      }

      function syncFromSlider() {
          let val = parseFloat(sliderSetpoint.value);
          if (isNaN(val)) return;
          setpoint.value = Math.min(95, Math.max(50, val));
          pushSetpoint();
      }

      // --- Lifecycle ---
      onMounted(async () => {
          await discoverFunctions();
          await Promise.all([fetchSensorState(), fetchDesiredState(), fetchLightState()]);
          pollInterval = setInterval(async () => {
              await Promise.all([fetchSensorState(), fetchDesiredState(), fetchLightState()]);
          }, 5500);
      });

      onUnmounted(() => {
          if (pollInterval) clearInterval(pollInterval);
      });

      return {
        // state
        currentTemp,
        setpoint,
        motionDetected,
        doorClosed,
        lightStatus,
        difference,
        diffClass,
        newSetpoint,
        sliderSetpoint,
        // methods
        updateSetpoint,
        adjustSetpoint,
        syncFromSlider
      };
    }
  }).mount('#app');
</script>
    </div>
  </div>
</div>
</body>
</html>
